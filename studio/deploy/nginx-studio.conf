# nimbus-01:/etc/nginx/sites-available/studio.canalmeteo.tv
#
# Modelo: nginx sirve el frontend estático desde /var/www/html/studio
# y hace de proxy de /api → uvicorn (backend FastAPI en 127.0.0.1:8787).
# El vídeo NO pasa por nginx (sube directo a Spaces con PUT prefirmado),
# así que no hace falta subir client_max_body_size para 2 GB.

server {
    listen 80;
    server_name studio.canalmeteo.tv;
    # → añade TLS con:  certbot --nginx -d studio.canalmeteo.tv

    root /var/www/html/studio;
    index index.html;

    # Frontend estático
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend FastAPI (uvicorn)
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
